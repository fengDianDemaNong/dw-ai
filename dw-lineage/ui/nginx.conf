upstream sql_tools_backend {
  # 后端地址，docker-compose 中为服务名；独立部署时改成实际 host:port
  server ${BACKEND_HOST}:${BACKEND_PORT};
}

server {
  listen 80;
  server_name localhost;

  # 应用挂在根路径下：vite 的 base 保持默认的 /，构建产物里的资源是 /assets/...。
  # 应用自己的路由前缀是 /lineage，所以入口是 http://<host>/lineage/ ——
  # 由下面的 SPA 回落接管，不需要再套一层挂载点，也不需要单独的跳转规则。
  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    # 路由为 history 模式需要设置该项
    try_files $uri $uri/ /index.html;
  }

  # 反向代理后端，使前端可用相对路径 /api 请求，规避跨域与地址硬编码
  location /api/ {
    proxy_pass http://sql_tools_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 大 SQL 解析耗时较长，超时需大于前端的 60s
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    client_max_body_size 10m;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
