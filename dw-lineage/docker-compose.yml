# 一键启动血缘分析服务（前端 + 后端）。
#
# 1) 配置：选择后端存储数据库、填连接信息
#      cp .env.example .env && vi .env
#    不改也能跑，默认用内嵌 H2，数据存在 docker 卷 backend-data 里。
#
# 2) 构建后端 jar：
#      (cd api && mvn package -DskipTests)
#
# 3) 启动：docker compose up -d
#
# 访问：控制台 http://localhost/lineage/
#       接口文档 http://localhost:18082/swagger-ui.html

services:
  backend:
    build:
      context: ./api
    image: sql-tools-backend
    networks:
      - docker-bridge
    environment:
      SPRING_PROFILES_ACTIVE: prd

      # ---- 服务端口 ----
      # 容器内外一致（组织 18080 / 仓建设 18081 / 数据地图 18082），不搞「容器内 8080」。
      # 下面 frontend 的 BACKEND_PORT 引用同一个变量，改一处两边同步，不会错位。
      SERVER_PORT: ${SERVER_PORT:-18082}

      # ---- 后端存储数据库。全部来自 .env，见 .env.example 的说明 ----
      DB_TYPE: ${DB_TYPE:-h2}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-dw_lineage}
      # DB_USER 是新口径，与 org / model 共用一份 .env；DB_USERNAME 是 lineage 老名字，
      # 继续透传以兼容老 .env。两个都注入空串也没关系 —— resolveUsername() 取第一个
      # 非空的，不看「有没有定义」，所以空串不会顶掉另一个。
      DB_USER: ${DB_USER:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PARAMS: ${DB_PARAMS:-}
      DB_URL: ${DB_URL:-}
      # h2 数据文件位置写死在挂载点上，跟着 .env 一起改会让数据落到卷外面，
      # 容器一重建就没了，所以不开放给用户配
      DB_H2_PATH: /app/data/dw_lineage

      # ---- 元数据服务 ----
      GRAVITINO_URL: ${GRAVITINO_URL:-http://host.docker.internal:8090}
      METADATA_SECRET_KEY: ${METADATA_SECRET_KEY:-}

      # 生产走 nginx 同源，无需放开跨域
      CORS_ALLOWED_ORIGINS: ""
    ports:
      - "${SERVER_PORT:-18082}:${SERVER_PORT:-18082}"
    volumes:
      # H2 数据落在容器内的 /app/data，不挂卷的话容器一重建，
      # 页面上配好的元数据服务和已保存的血缘版本就全没了
      - backend-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      # 上下文必须是仓库根：前端依赖 npm workspace 的 packages/engine，
      # 且 npm ci 要按根 workspaces 数组找到全部五个成员目录。见 ADR-0014。
      # 与 dw-org / dw-model 的 docker-compose.yml 同写法。
      context: ..
      dockerfile: dw-lineage/ui/Dockerfile
    image: sql-tools-frontend
    networks:
      - docker-bridge
    environment:
      # nginx 把 /api 反代到后端，前端因此只用相对路径，不含任何硬编码地址
      BACKEND_HOST: backend
      BACKEND_PORT: ${SERVER_PORT:-18082}

      # ---- 运行时配置 ----
      # 容器启动时由 entrypoint 脚本渲染成 /config.json（见 ui/Dockerfile）。
      # 部署期才知道的事（前后端不在一台机器）改这里重启容器即可，不必重新构建。
      # 留空 = 同源相对路径，即改动前的默认行为。
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      # 本控制台自己的对外地址，跨服务跳转时用来自报家门
      VITE_BASE_URL: ${LINEAGE_UI_PUBLIC_URL:-}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  backend-data:


networks:
  docker-bridge:
    name: docker-bridge  # 使用已有的 bridge 网络，如果不存在则创建
    driver: bridge
    external: true  # 关键：标记为外部网络，down 时不会删除