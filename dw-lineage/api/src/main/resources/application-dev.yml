# 开发环境。IDEA 直接运行 com.dwai.lineage.Main 即可，不必在 Run Configuration 里填环境变量。
# 地址可用环境变量 GRAVITINO_URL 覆盖，避免把机器地址写死在代码里。
#
# 运行模式不在这里：本 profile 不设模式，所以直接跑 Main 得到的是普通模式（standard）。
# 取值由 LineageProperties.runMode() 的三级链决定：LINEAGE_RUN_MODE > DW_AI_MODE > 兜底 standard。
# 要独立模式就在 Run Configuration 的 Environment variables 里加 LINEAGE_RUN_MODE=standalone
# （跟 org / model 统一设 DW_AI_MODE=standalone 也行，那样三个模块一个开关就够）—— 光把前端换成
# `npm run dev:standalone` 是不够的，那会让两边模式对不上（前端的 /api 请求全 401）。
# 注意这个文件只在 spring.profiles.active=dev 时才会被加载。

database:
  # 默认沿用 application.yml：type=h2，数据文件 ./data/dw_lineage（相对模块工作目录）。
  # 空库由 Flyway 自动执行 V1__schema.sql + V2__init_data.sql；已有库不自动升级，
  # 升级走 db/migration/ 下新增的版本脚本。
  #
  # 改连 MySQL 时取消下面注释（库要先存在；空库会自动建表）：
  # type: mysql
  # host: localhost
  # port: 3306
  # name: dw_lineage
  # username: root
  # password: root
  #
  # 改连 PostgreSQL：
  # type: postgresql
  # host: localhost
  # port: 5432
  # name: dw_lineage
  # username: postgres
  # password: postgres

gravitino:
  url: ${GRAVITINO_URL:http://localhost:8090}

logging:
  level:
    com.dwai.lineage: DEBUG
