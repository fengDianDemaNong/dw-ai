spring:
  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      # 表结构由 Flyway 管理（db/migration/），禁止 Hibernate 自动建表
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true

  # 表结构由 Flyway 托管，与 dw-org / dw-model 一致：
  #   - 空库启动时自动执行 V1__schema.sql + V2__init_data.sql；
  #   - 已用安装包脚本建好的老库没有 flyway_schema_history，baseline 接管后
  #     从 V3 起继续应用新迁移（V1/V2 的内容与 release/sql/<方言>/ 完全一致）；
  #   - 之后改表结构：在 db/migration/<方言>/ 新增 V3__xxx.sql，同步 release/sql。
  # 脚本目录由 FlywayLocationEnvironmentPostProcessor 按 database.type 覆盖，
  # 这里只写默认（h2）。
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: true
    baseline-version: 2

# ---------------------------------------------------------------
# 数据库：改这里即可切换后端，URL / 驱动 / 建表脚本会自动匹配
#
# 环境变量口径与 dw-org / dw-model 对齐（DB_URL / DB_TYPE / DB_USER / DB_PASSWORD /
# DW_AI_HOME），同一份 .env 可以同时喂三个服务，不必记两套名字。
# lineage 独有的 DB_HOST / DB_PORT / DB_NAME / DB_PARAMS 是额外能力，保留 ——
# org/model 只认整串 DB_URL，lineage 还允许拆着填。
# ---------------------------------------------------------------
database:
  # h2 | mysql | postgresql
  type: ${DB_TYPE:h2}
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:}
  name: ${DB_NAME:dw_lineage}
  # DB_USER 是新口径（与 org/model 一致）；DB_USERNAME 是 lineage 老名字。
  # 两个分开绑、由 resolveUsername() 取第一个非空的，不写成 ${DB_USER:${DB_USERNAME:}} ——
  # Spring 对「已定义但为空串」的变量照样取值，而 compose 透传时必然注入空串，
  # 嵌套写法会让 DB_USER= 空值把老的 DB_USERNAME 顶掉。
  username: ${DB_USER:}
  username-legacy: ${DB_USERNAME:}
  password: ${DB_PASSWORD:}
  # 仅 type=h2 时有效。默认落点与 org/model 同规则：${DW_AI_HOME}/data/ 下。
  # 容器里 compose 显式写死了 DB_H2_PATH（必须落在挂载卷上，否则容器一重建数据就没），
  # 所以那条路径优先级最高、容器行为不变。
  h2-path: ${DB_H2_PATH:${DW_AI_HOME:./}/data/dw_lineage}
  # 附加连接参数，形如 useSSL=false&serverTimezone=Asia/Shanghai
  params: ${DB_PARAMS:}
  # 完整 JDBC URL。填了会忽略上面的 host/port/name，用于需要特殊连接串的场景
  url: ${DB_URL:}

server:
  # 端口只在这一个文件里定义，不按 profile 覆盖 —— 与 dw-org（18080）、dw-model（18081）
  # 同形态。此前 multi profile 单独覆盖成 18082，于是「不带 profile 起在 8080」这件事
  # 会在开发、打包、容器三条路径上各表现一次，排查时很难归因。
  #
  # 容器里也用同一个端口（compose 显式给 SERVER_PORT），内外一致。
  port: ${SERVER_PORT:18082}

# 跨域白名单。生产环境前后端应通过 nginx 反向代理同源访问，无需跨域；
# 此处默认只放开本地开发端口。
cors:
  allowed-origins: ${CORS_ORIGINS:*}

lineage:
  # 模式取值的两处默认值都必须留空，不能写 standard / standalone！
  # LineageProperties.runMode() 的回落是「run-mode 非空则用它，否则用 deploy-mode」，
  # 这里一旦给出非空默认值，run-mode 就永远非空 —— 下一行的 deploy-mode（= DW_AI_MODE）
  # 被彻底架空，于是「统一设 DW_AI_MODE=standalone」在数据地图上静默不生效，
  # 表现为「独立部署却要登录」。dw-model 的 DW_AI_MODE 就这么失效过，别再改回去。
  # 优先级：LINEAGE_RUN_MODE > DW_AI_MODE > 兜底 standard（朝「要认证」倒）。
  run-mode: ${LINEAGE_RUN_MODE:}
  deploy-mode: ${DW_AI_MODE:}
  org-base-url: ${ORG_BASE_URL:}
  # 组织平台的**前端**地址，给浏览器跳转用（`/org/login` 等页面路径）。
  # 基础配置留空：单跑 standard / standalone 时本模块没有门户可回（前端另有内置兜底）。
  # multi 下由 application-multi.yml 给默认值 —— 与 org-base-url 同一形态。
  org-ui-url: ${ORG_UI_URL:}
  service-base-url: ${SERVICE_BASE_URL:}
  public-base-url: ${PUBLIC_BASE_URL:}
  # 服务间令牌，保护 /internal/v1/**（组织 fan-out 到数据地图的项目镜像入口）。
  # 留空 = 这些接口一律 401，不再回落成开放 —— 「忘了配」要立刻报错，不能默认打开。
  # org / model / lineage 三处必须配同一个值（环境变量 MODULE_TOKEN）。
  module-token: ${MODULE_TOKEN:}
  # multi 模式下校验组织签发的 JWT。环境变量名与 dw-org / dw-model 一致，
  # 一次部署只配一份；两边不一致的表现是「组织登录成功但数据地图 401」。
  #   dev  = HS256 共享密钥（模块也持密钥，仅适合开发）
  #   oidc = Casdoor RS256 + JWKS（模块只持公钥，生产用这个）
  security:
    mode: ${SECURITY_MODE:dev}
    jwt-secret: ${JWT_SECRET:dw-ai-dev-secret-change-me-please-32b}
    casdoor:
      issuer: ${CASDOOR_ISSUER:}
      jwk-set-uri: ${CASDOOR_JWK:}

sql:
  parse:
    # 单次解析超时（秒）
    timeout-seconds: 60
    # 解析线程栈大小（MB），用于容纳较深的 SQL 嵌套
    stack-size-mb: 16
    # 并发解析上限，超出直接拒绝并提示稍后重试
    max-concurrent: 16

metadata:
  # 元数据服务凭据的加密主密钥。不落配置文件，只从环境变量注入。
  # 未配置时服务仍能启动，但保存/使用带凭据的元数据服务（dbx）会明确报错，
  # 以免凭据明文落库。
  secret-key: ${METADATA_SECRET_KEY:}
  gravitino:
    # 逐表加载的并发度，避免一条 SQL 涉及几十张表时串行往返
    concurrency: 8
    # 单张表的加载超时（秒），超时按「结构未知」降级处理
    per-table-timeout-seconds: 10

# 租户上下文由 TenantInterceptor 从 X-Tenant-Id / X-Project-Id 请求头解析，
# 不带头时落到这里配置的默认租户（对应 V2 迁移写入的那条记录）。
tenant:
  default-tenant-id: 1
  default-project-id: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.dwai.lineage: INFO
    # ⚠️ 安全：dbx 的 GET /api/connection/list 会「明文返回数据库密码」。
    # HTTP 层的报文日志会把整个响应体写进日志文件，所以这几个 logger 显式钉在 INFO，
    # 避免有人为了排查问题把 root 调成 DEBUG 时连带把密码写进磁盘。
    # 排查 dbx 对接问题请看 com.dwai.lineage.service.metadata.dbx 的日志，它已做过脱敏。
    org.apache.hc.client5.http.wire: INFO
    org.apache.hc.client5.http.headers: INFO
    org.springframework.web.client: INFO
