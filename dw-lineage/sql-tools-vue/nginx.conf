upstream sql_tools_backend {
  # 后端地址，docker-compose 中为服务名；独立部署时改成实际 host:port
  server ${BACKEND_HOST}:${BACKEND_PORT};
}

server {
  listen 80;
  server_name localhost;

  # 应用挂在 /sql-tools/ 子路径下（与前端构建时的 base 一致，见 .env.production）。
  # 根路径本身没有内容，直接跳过去 —— 否则访问 http://<host>/ 会看到 nginx
  # 的默认欢迎页，看起来就像部署失败了。
  location = / {
    return 302 /sql-tools/;
  }

  location ^~/sql-tools {
    alias /usr/share/nginx/html/sql-tools;
    index index.html index.htm;
    # 路由为 history 模式需要设置该项
    try_files $uri $uri/ /sql-tools/index.html;
  }

  # 反向代理后端，使前端可用相对路径 /api 请求，规避跨域与地址硬编码
  location /api/ {
    proxy_pass http://sql_tools_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 大 SQL 解析耗时较长，超时需大于前端的 60s
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    client_max_body_size 10m;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
