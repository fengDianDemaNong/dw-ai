# 全套：租户管理 + 智仓。仓库根 docker compose up -d --build
# 单服务：docker compose -f dw-org/docker-compose.yml up -d --build
#         docker compose -f dw-model/docker-compose.yml up -d --build
# PostgreSQL：docker compose --profile postgres up -d  （库 dw_org、dw_mode、dw_lineage）
services:
  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-dwai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dwai-pg:/var/lib/postgresql/data
      - ./infra/db/postgres-init.sql:/docker-entrypoint-initdb.d/02-create-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dwai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    profiles: ["mysql"]
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dw_org}
      MYSQL_USER: ${MYSQL_USER:-dwai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dwai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dwai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - dwai-mysql:/var/lib/mysql
      - ./infra/db/mysql-init.sql:/docker-entrypoint-initdb.d/02-create-dbs.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-dwai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  org-api:
    build:
      # 上下文必须是仓库根：dw-common 是独立模块，只给 api 目录 COPY 不到它
      context: .
      dockerfile: dw-org/api/Dockerfile
    image: dw-org:0.1.3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 容器内外同一个端口（组织 18080 / 仓建设 18081 / 数据地图 18082）。
      SERVER_PORT: 18080
      DW_AI_HOME: /app
      DB_URL: ${ORG_DB_URL:-}
      DB_USER: ${ORG_DB_USER:-${DB_USER:-}}
      DB_PASSWORD: ${ORG_DB_PASSWORD:-${DB_PASSWORD:-}}
      DB_TYPE: ${ORG_DB_TYPE:-${DB_TYPE:-}}
      DW_AI_MODE: ${DW_AI_MODE:-multi}
      # 服务间令牌，仅 multi 需要。org / model / lineage 三处必须是同一个值，
      # 这里由同一个 .env 透传，天然一致。留空 = /internal/v1/** 一律 401（见 ADR-0012），
      # 表现为「组织里建了项目，仓建设里看不见」。
      MODULE_TOKEN: ${MODULE_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-dw-ai-dev-secret-change-me-please-32b}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PUBLIC_BASE_URL: ${ORG_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
    ports:
      - "${ORG_API_PORT:-18080}:18080"
    volumes:
      - dw-org-h2:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 10

  org-ui:
    build:
      context: .
      dockerfile: dw-org/ui/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-.}
        VITE_DEPLOY_MODE: ${DW_AI_MODE:-multi}
    image: dw-org-ui:0.1.3
    environment:
      # 运行时配置：容器启动时渲染成 /config.json，与上面的 build args 同名但不是
      # 同一条通路 —— 这里是启动期生效，改完重启容器即可，不必重新构建。
      # 留空 = 同源相对路径（nginx 反代 /api），即改动前的默认行为。
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_BASE_URL: ${ORG_UI_PUBLIC_URL:-}
    ports:
      - "${ORG_UI_PORT:-8080}:80"
    depends_on:
      org-api:
        condition: service_healthy

  model-api:
    build:
      # 上下文必须是仓库根：dw-common 是独立模块，只给 api 目录 COPY 不到它
      context: .
      dockerfile: dw-model/api/Dockerfile
    image: dw-model:0.1.3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 容器内外同一个端口（组织 18080 / 仓建设 18081 / 数据地图 18082）。
      SERVER_PORT: 18081
      DW_AI_HOME: /app
      DB_URL: ${MODEL_DB_URL:-}
      DB_USER: ${MODEL_DB_USER:-${DB_USER:-}}
      DB_PASSWORD: ${MODEL_DB_PASSWORD:-${DB_PASSWORD:-}}
      DB_TYPE: ${MODEL_DB_TYPE:-${DB_TYPE:-}}
      DW_AI_MODE: ${DW_AI_MODE:-multi}
      # 服务间令牌，仅 multi 需要。org / model / lineage 三处必须是同一个值，
      # 这里由同一个 .env 透传，天然一致。留空 = /internal/v1/** 一律 401（见 ADR-0012），
      # 表现为「组织里建了项目，仓建设里看不见」。
      MODULE_TOKEN: ${MODULE_TOKEN:-}
      DW_AI_LLM_SECRET: ${DW_AI_LLM_SECRET:-dw-ai-llm-dev-secret-change-me-32b}
      SECURITY_MODE: ${SECURITY_MODE:-dev}
      JWT_SECRET: ${JWT_SECRET:-dw-ai-dev-secret-change-me-please-32b}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-true}
      CASDOOR_ISSUER: ${CASDOOR_ISSUER:-}
      CASDOOR_JWK: ${CASDOOR_JWK:-}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-}
      CASDOOR_ORG_MAP: ${CASDOOR_ORG_MAP:-built-in:t-xinghe,casbin:t-xinghe}
      RULES_BASE: ${RULES_BASE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ORG_BASE_URL: ${ORG_BASE_URL:-http://org-api:18080}
      # 组织平台的**前端**地址，给浏览器跳转用（与上一行的 API 地址不是一回事）。
      # 必须是**浏览器**够得着的地址，所以填宿主端口而不是容器名 org-ui。
      # 改了 ORG_UI_PORT 就要跟着改这里。
      ORG_UI_URL: ${ORG_UI_URL:-http://localhost:8080}
      SR_ENABLED: ${SR_ENABLED:-false}
      SR_URL: ${SR_URL:-jdbc:mysql://host.docker.internal:9030/dwai}
      SR_USER: ${SR_USER:-root}
      SR_PASSWORD: ${SR_PASSWORD:-}
      DS_ENABLED: ${DS_ENABLED:-false}
      DS_URL: ${DS_URL:-http://host.docker.internal:12345/dolphinscheduler}
      DS_TOKEN: ${DS_TOKEN:-}
      DS_PROJECT_CODE: ${DS_PROJECT_CODE:-0}
    ports:
      - "${API_PORT:-18081}:18081"
    volumes:
      - dw-mode-h2:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18081/api/health"]
      interval: 15s
      timeout: 3s
      retries: 10
    depends_on:
      - org-api

  model-ui:
    build:
      context: .
      dockerfile: dw-model/ui/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-.}
        VITE_DEPLOY_MODE: ${DW_AI_MODE:-multi}
    image: dw-model-ui:0.1.3
    environment:
      # 运行时配置：容器启动时渲染成 /config.json，与上面的 build args 同名但不是
      # 同一条通路 —— 这里是启动期生效，改完重启容器即可，不必重新构建。
      # 留空 = 同源相对路径（nginx 反代 /api），即改动前的默认行为。
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_BASE_URL: ${MODEL_UI_PUBLIC_URL:-}
    ports:
      - "${MODEL_UI_PORT:-8081}:80"
    depends_on:
      model-api:
        condition: service_healthy

volumes:
  dw-org-h2:
  dw-mode-h2:
  dwai-pg:
  dwai-mysql:
