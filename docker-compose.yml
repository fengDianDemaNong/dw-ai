# 默认：控制台 + Java API + 嵌入式 H2（卷 dwai-h2）。
# PostgreSQL：docker compose --profile postgres up -d
# 外部库：见 .env.example，设置 DB_URL 后 docker compose up -d api ui
services:
  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dwai}
      POSTGRES_USER: ${POSTGRES_USER:-dwai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dwai-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dwai} -d ${POSTGRES_DB:-dwai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    profiles: ["mysql"]
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dwai}
      MYSQL_USER: ${MYSQL_USER:-dwai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dwai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dwai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - dwai-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-dwai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: dw-ai-api:0.1.3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: 8080
      DW_AI_HOME: /app
      DB_URL: ${DB_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_TYPE: ${DB_TYPE:-}
      DW_AI_MODE: ${DW_AI_MODE:-multi}
      DW_AI_LLM_SECRET: ${DW_AI_LLM_SECRET:-dw-ai-llm-dev-secret-change-me-32b}
      SECURITY_MODE: ${SECURITY_MODE:-dev}
      JWT_SECRET: ${JWT_SECRET:-dw-ai-dev-secret-change-me-please-32b}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-true}
      CASDOOR_ISSUER: ${CASDOOR_ISSUER:-}
      CASDOOR_JWK: ${CASDOOR_JWK:-}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-}
      CASDOOR_ORG_MAP: ${CASDOOR_ORG_MAP:-built-in:t-xinghe,casbin:t-xinghe}
      RULES_BASE: ${RULES_BASE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SR_ENABLED: ${SR_ENABLED:-false}
      SR_URL: ${SR_URL:-jdbc:mysql://host.docker.internal:9030/dwai}
      SR_USER: ${SR_USER:-root}
      SR_PASSWORD: ${SR_PASSWORD:-}
      DS_ENABLED: ${DS_ENABLED:-false}
      DS_URL: ${DS_URL:-http://host.docker.internal:12345/dolphinscheduler}
      DS_TOKEN: ${DS_TOKEN:-}
      DS_PROJECT_CODE: ${DS_PROJECT_CODE:-0}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - dwai-h2:/app/data

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-.}
        VITE_DEPLOY_MODE: ${DW_AI_MODE:-multi}
    image: dw-ai-ui:0.1.3
    ports:
      - "${UI_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dwai-h2:
  dwai-pg:
  dwai-mysql:
