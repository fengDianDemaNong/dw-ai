# 只起租户管理。仓库根：docker compose -f dw-org/docker-compose.yml up -d --build
# 前端 Nginx 把 /api 反代到 org-api。
services:
  org-api:
    build:
      # 上下文必须是仓库根：dw-common 是独立模块，只给 api 目录 COPY 不到它
      context: ..
      dockerfile: dw-org/api/Dockerfile
    image: dw-org:0.1.3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 容器内外同一个端口（组织 18080 / 仓建设 18081 / 数据地图 18082）。
      # 原先这里是 8080 + 映射 18080:8080，容器内外的端口号对不上，
      # 排查时要不停在两个号之间换算；现在一律同号。
      SERVER_PORT: 18080
      DW_AI_HOME: /app
      DB_URL: ${ORG_DB_URL:-}
      DB_USER: ${ORG_DB_USER:-${DB_USER:-}}
      DB_PASSWORD: ${ORG_DB_PASSWORD:-${DB_PASSWORD:-}}
      DB_TYPE: ${ORG_DB_TYPE:-${DB_TYPE:-}}
      DW_AI_MODE: ${DW_AI_MODE:-multi}
      JWT_SECRET: ${JWT_SECRET:-dw-ai-dev-secret-change-me-please-32b}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PUBLIC_BASE_URL: ${ORG_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
    ports:
      - "${ORG_API_PORT:-18080}:18080"
    volumes:
      - dw-org-h2:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 10

  org-ui:
    build:
      context: ..
      dockerfile: dw-org/ui/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-.}
        VITE_DEPLOY_MODE: ${DW_AI_MODE:-multi}
    image: dw-org-ui:0.1.3
    environment:
      # ---- 运行时配置 ----
      # 与上面的 build args 同名，但**不是同一条通路**：build args 是构建期烘焙进产物，
      # 这里是容器启动时由 entrypoint 脚本渲染成 /config.json（见 ui/Dockerfile）。
      # 部署期才知道的事（前后端不在一台机器）改这里重启容器即可，不必重新构建。
      # 都留空 = 同源相对路径（由 nginx 反代 /api），即改动前的默认行为。
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      # 本控制台自己的对外地址，跨服务跳转时用来自报家门
      VITE_BASE_URL: ${ORG_UI_PUBLIC_URL:-}
    ports:
      - "${ORG_UI_PORT:-8080}:80"
    depends_on:
      org-api:
        condition: service_healthy

volumes:
  dw-org-h2:
