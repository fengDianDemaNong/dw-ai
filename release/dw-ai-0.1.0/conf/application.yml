# 覆盖 jar 内默认配置。敏感项优先走 env.sh 环境变量。
server:
  port: ${SERVER_PORT:8080}

spring:
  web:
    resources:
      static-locations: file:${WEB_STATIC_DIR:libs/web}/
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/dwai}
    username: ${DB_USER:dwai}
    password: ${DB_PASSWORD:dwai}

dwai:
  web:
    static-dir: ${WEB_STATIC_DIR:}
    cors-origins: ${CORS_ORIGINS:*}
  starrocks:
    enabled: ${SR_ENABLED:false}
    url: ${SR_URL:jdbc:mysql://127.0.0.1:9030/dwai}
    username: ${SR_USER:root}
    password: ${SR_PASSWORD:}
  dolphinscheduler:
    enabled: ${DS_ENABLED:false}
    base-url: ${DS_URL:http://127.0.0.1:12345/dolphinscheduler}
    token: ${DS_TOKEN:}
    project-code: ${DS_PROJECT_CODE:0}
